<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172218" />
    <title>Voxel Vault — Лаборатория blockworld</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #152017;
        color: #f4eddc;
        font:
          14px/1.4 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      #scene {
        position: fixed;
        inset: 0;
      }
      #scene canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #panel {
        position: fixed;
        z-index: 2;
        top: 20px;
        left: 20px;
        width: 300px;
        max-height: calc(100vh - 40px);
        overflow: auto;
        padding: 18px;
        border: 1px solid #ccb17a55;
        border-radius: 12px;
        background: #101711d9;
        box-shadow: 0 14px 45px #0008;
        backdrop-filter: blur(14px);
        transition:
          transform 0.25s ease,
          opacity 0.25s ease;
      }
      #panel.hidden {
        transform: translateX(calc(-100% - 28px));
        opacity: 0;
        pointer-events: none;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
      }
      h1 {
        margin: 0;
        font-size: 17px;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0 0 16px;
        color: #aab6a1;
        font-size: 12px;
      }
      .control {
        padding: 10px 0;
        border-top: 1px solid #ffffff12;
      }
      .control label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #dfdfcd;
        font-size: 12px;
      }
      .control output {
        color: #e5c47f;
        font-variant-numeric: tabular-nums;
      }
      input[type='range'] {
        display: block;
        width: 100%;
        margin: 10px 0 0;
        accent-color: #e9b663;
      }
      button {
        border: 1px solid #e4c16a66;
        border-radius: 7px;
        color: #ffe7b3;
        background: #614a26a6;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        padding: 8px 10px;
        cursor: pointer;
      }
      button:hover {
        background: #84632f;
      }
      #toolbar {
        position: fixed;
        z-index: 3;
        right: 20px;
        top: 20px;
        display: flex;
        gap: 8px;
      }
      #credit {
        position: fixed;
        right: 22px;
        bottom: 18px;
        padding: 7px 10px;
        border-radius: 6px;
        background: #1017119c;
        color: #d4cfbd;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      #metrics {
        position: fixed;
        left: 50%;
        bottom: 18px;
        z-index: 3;
        transform: translateX(-50%);
        max-width: calc(100vw - 360px);
        padding: 7px 10px;
        border-radius: 6px;
        background: #101711d9;
        color: #d4cfbd;
        font:
          11px/1.4 ui-monospace,
          monospace;
        white-space: nowrap;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        color: #ecd49e;
        background: #162018;
        transition: opacity 0.35s;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      .hint {
        margin-top: 14px;
        color: #7f8b7e;
        font-size: 11px;
      }
      @media (max-width: 650px) {
        #panel {
          top: 12px;
          left: 12px;
          width: min(280px, calc(100vw - 24px));
          max-height: 72vh;
        }
        #toolbar {
          top: auto;
          right: 12px;
          bottom: 12px;
        }
        #credit {
          display: none;
        }
        #metrics {
          left: 8px;
          bottom: 62px;
          transform: none;
          max-width: calc(100vw - 16px);
          overflow: hidden;
          text-overflow: ellipsis;
        }
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <aside id="panel">
      <header>
        <h1>Blockworld · render PoC</h1>
        <button id="reset">Сброс</button>
      </header>
      <p>
        Один и тот же исходный voxel-мир: переключай baseline и динамические тени/тональную кривую
        без перезагрузки.
      </p>
      <div id="controls"></div>
      <div class="hint">H — скрыть панель · настройки сохраняются в этом браузере</div>
    </aside>
    <div id="toolbar">
      <button id="graphics-mode">Рендер: исходный</button><button id="toggle">Скрыть панель</button
      ><button id="shot">Сохранить кадр</button>
    </div>
    <div id="metrics">Собираю renderer stats…</div>
    <div id="credit">Voxel Vault · scene study</div>
    <div id="loading">Загружаю blockworld и сундук…</div>
    <script type="module" src="/src/dev/blockworld-scene-lab.ts"></script>
  </body>
</html>
