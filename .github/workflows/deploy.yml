# Checks on every push to master and every pull request; a RELEASE deploys. A release is a semver
# tag without a prefix, as the repository's earlier tags (git tag 0.3.0 && git push origin 0.3.0): the Go API to the VPS cluster (Helm,
# values.prod.yaml), then the frontend to Cloudflare (Worker + static assets). The image is tagged
# with the release. After economy cutover, recovery requires a compatible context image;
# redeploying an older legacy tag cannot undo the permanent source fence or ledger imports.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   KUBECONFIG_B64         deploy/bootstrap/make-kubeconfig.sh output (SA voxel-vault-deployer)
#   CLOUDFLARE_API_TOKEN   Workers Scripts:Edit + Workers Routes/Custom Domains on mono.place
#   CLOUDFLARE_ACCOUNT_ID
# Prerequisites on the cluster (once): deploy/bootstrap/README.md — Vault collection, role, pull secret.
name: deploy

on:
  push:
    branches: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:

concurrency:
  # Releases queue up one after another; checks of a branch replace their older run.
  group: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: economy_test
          POSTGRES_PASSWORD: economy_test
          POSTGRES_DB: legacy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U economy_test -d legacy_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui
      - run: npm run test:physics
      - uses: actions/setup-go@v5
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - run: go vet ./... && go test -race ./...
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://economy_test:economy_test@localhost:5432/legacy_test?sslmode=disable
          TEST_WALLET_DATABASE_URL: postgres://economy_test:economy_test@localhost:5432/postgres?sslmode=disable
      # Helm 3, as loncha (alpine/helm:3.18.3): Helm 4's server-side apply rejects fields the
      # cluster's older VSO CRDs do not declare (VaultStaticSecret.spec.destination.excludeRaw).
      - uses: azure/setup-helm@v4
        with: { version: v3.18.3 }
      - run: helm lint deploy/helm/voxel-vault -f deploy/helm/voxel-vault/values.prod.yaml

  api:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/loperd/mcroulette-api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          {
            registry: ghcr.io,
            username: '${{ github.actor }}',
            password: '${{ secrets.GITHUB_TOKEN }}',
          }
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
      # Helm 3, as loncha (alpine/helm:3.18.3): Helm 4's server-side apply rejects fields the
      # cluster's older VSO CRDs do not declare (VaultStaticSecret.spec.destination.excludeRaw).
      - uses: azure/setup-helm@v4
        with: { version: v3.18.3 }
      - name: helm upgrade
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          umask 077
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" helm upgrade --install voxel-vault deploy/helm/voxel-vault \
            -n voxel-vault -f deploy/helm/voxel-vault/values.prod.yaml \
            --set image.repository="$IMAGE" --set image.tag="$GITHUB_REF_NAME" \
            --wait --atomic --timeout 5m
          rm -f "$RUNNER_TEMP/kubeconfig"

  frontend:
    # After the API: a new frontend never calls an API that is not deployed yet.
    needs: api
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.20.0'
          command: deploy
