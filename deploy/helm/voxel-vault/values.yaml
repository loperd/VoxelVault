# Base values. Environments layer on top:
#   values.local.yaml — OrbStack on this Mac: https://vault.loper.me (tunnel), local Vault + VSO
#   values.prod.yaml  — VPS cluster: https://voxelvault.mono.place, API api-voxelvault.mono.place
nameOverride: ''
fullnameOverride: ''
image:
  repository: voxel-vault-api
  tag: local
  pullPolicy: IfNotPresent
imagePullSecrets: [] # e.g. [{name: ghcr-pull}] for the private registry
replicaCount: 1
# Publishes restriction.expired events for account restrictions whose time has passed.
restrictionExpiry:
  enabled: true
  schedule: '*/5 * * * *'
# Moves the transfer tax from platform-tax into the treasury (once per hour window).
taxSweep:
  enabled: true
  schedule: '5 * * * *'

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# A project-local instance of the shared Overseer Gateway is the public edge.
# The backend keeps enforcing application permissions and resource ownership.
gateway:
  enabled: true
  image:
    repository: registry.gitlab.com/overseerio/gateway
    tag: v0.1.22
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  existingSecret: voxel-vault-gateway-secrets
  # Shared gateway configuration; the initial profile preserves existing sessions.
  # Later auth/providers/transforms are configured here, independently of backends.
  config:
    server:
      port: '${PORT}'
    upstreams:
      api:
        url: '${LONCHA_UPSTREAM_URL}'
    routes:
      # Everything under /api/v1/ needs the gateway session: the gateway verifies the JWT and sets the
      # trusted X-User-Id / X-Session-Id / X-Scopes / X-Internal-Token headers the API relies on.
      # /api/v1/auth/* is served by the telegramAuth plugin, not proxied.
      - pattern: '/api/v1/'
        upstream: api
      # Anonymous catalogue the API serves without an account.
      - pattern: 'GET /api/v1/cases'
        upstream: api
        public: true
      - pattern: 'GET /api/v1/cases/{caseID}/catalog'
        upstream: api
        public: true
      - pattern: 'GET /api/v1/items/{itemID}/image.svg'
        upstream: api
        public: true
      - pattern: 'GET /readyz'
        upstream: api
        public: true
    telegramAuth:
      mode: oidc
      redirectUrl: '' # set per environment: https://<frontend host>/api/v1/auth/telegram/callback
    plugins:
      telegramAuth: true
      cors: true
      csrf: false
      realtime: false
    cors:
      allowedOrigins:
        - http://localhost:5173
        - http://localhost:4173
  env:
    GATEWAY_STRIP_CLIENT_CREDENTIALS: 'true'
  networkPolicy:
    enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Configuration = env. Two stores, nothing else (no .env files):
#   env:     non-secret env, UPPERCASE keys → ConfigMap <fullname>-env (API and bundled Postgres)
#   secrets: HashiCorp Vault KV → VSO → Secret (below)
# Everything the browser checks belongs to the frontend origin: passkeys (WEBAUTHN_RP_ID),
# the Telegram redirect, the session cookie.
env:
  HTTP_ADDRESS: ':8080'
  FRONTEND_URL: 'http://localhost:5173/'
  WEBAUTHN_RP_ID: 'localhost'
  WEBAUTHN_RP_NAME: 'Voxel Vault'
  WEBAUTHN_ORIGINS: 'http://localhost:5173'
  COOKIE_SECURE: 'false'
  DEFAULT_ROLE: 'player'
  WALLET_ASSETS: 'currency,travel-scraps,deep-ore,end-shards,dragon-scales,quantum-shards'
  # Telegram Login (OIDC): the client id is the bot id, public (it is in the authorization URL).
  TELEGRAM_CLIENT_ID: '8751479936'
  TELEGRAM_REDIRECT_URL: ''
  # Bundled Postgres (postgres.enabled); its password and DATABASE_URL are secrets.
  POSTGRES_USER: 'voxel'
  POSTGRES_DB: 'voxel_vault'

# ── Secrets: Vault Secrets Operator, as in loncha ─────────────────────────────────────────────
# Keys in the KV (all env):
#   TELEGRAM_CLIENT_SECRET   Telegram OIDC client secret (empty/absent → Telegram login off)
#   DATABASE_URL             postgres://… (with the bundled Postgres: its Service, user, password)
#   INVENTORY_DATABASE_URL   separate Inventory runtime connection
#   WALLET_DATABASE_URL      separate Wallet runtime connection
#   POSTGRES_PASSWORD        only with the bundled Postgres
# PREREQ for vso: the KV, a read policy and a Kubernetes-auth role bound to this chart's
# ServiceAccount exist BEFORE switching to vso, or VSO overwrites the Secret with nothing.
secrets:
  source: existingSecret # vso | existingSecret
  existingSecret: voxel-vault-secrets
  vso:
    address: 'http://vault.vault.svc:8200'
    authMount: 'kubernetes'
    role: 'voxel-vault'
    mount: 'secret' # the shared KV-v2 mount, as loncha
    path: 'local/voxel-vault' # <env>/<app>: local/voxel-vault, prod/voxel-vault
    gatewayPath: '' # KV path of the gateway-only Secret (gateway.existingSecret); empty = provisioned by hand
    refreshAfter: '60s'
    rolloutRestart: true # restart the API when the secret changes
    excludeRaw: true

# Public entrance of the API (haproxy-ingress behind Cloudflare). Off locally (Vite proxies to the Service).
ingress:
  enabled: false
  className: haproxy
  host: ''
  sslRedirect: true
  hsts: true
  tlsSecretName: '' # empty = TLS terminates at Cloudflare
  annotations: {}

# The API image is distroless :nonroot (uid 65532).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ['ALL']

serviceAccount:
  create: true
  name: ''
  # The API never calls the kube-API: no token mounted in its pod.
  automountServiceAccountToken: false

# Bundled single-node PostgreSQL (infrastructure only; its credentials are env and secrets).
postgres:
  enabled: true
  image: postgres:17-alpine
  storage: 2Gi
  storageClassName: ''
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
