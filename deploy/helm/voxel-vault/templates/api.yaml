{{- if ne .Values.service.type "ClusterIP" }}
{{- fail "the backend service must be ClusterIP" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "voxel-vault.fullname" . }}
  labels:
    {{- include "voxel-vault.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "voxel-vault.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voxel-vault.fullname" . }}
  labels:
    {{- include "voxel-vault.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "voxel-vault.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "voxel-vault.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # A changed `env:` restarts the API; a changed Vault secret restarts it through VSO.
        checksum/env: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "voxel-vault.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          # All configuration is env: values `env:` (ConfigMap) and secrets from Vault (VSO → Secret).
          envFrom:
            - configMapRef:
                name: {{ include "voxel-vault.fullname" . }}-env
          env:
            {{- range $key := list "INVENTORY_DATABASE_URL" "WALLET_DATABASE_URL" "IDENTITY_DATABASE_URL" "SECURITY_DATABASE_URL" "GATEWAY_INTERNAL_TOKEN" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "voxel-vault.secretName" $ | quote }}
                  key: {{ $key }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
