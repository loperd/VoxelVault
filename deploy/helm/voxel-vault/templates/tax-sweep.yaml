{{- if .Values.taxSweep.enabled }}
# Sweeps platform-tax into the treasury once per hour window (idempotent, runtime credentials only).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "voxel-vault.fullname" . }}-tax-sweep
  labels:
    {{- include "voxel-vault.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.taxSweep.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "voxel-vault.serviceAccountName" . }}
          automountServiceAccountToken: false
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: tax-sweep
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/tax-sweep"]
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              env:
                - name: WALLET_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "voxel-vault.secretName" . | quote }}
                      key: WALLET_DATABASE_URL
{{- end }}
